<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><title>Coin Rush 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
*{box-sizing:border-box}body{margin:0;overflow:hidden;font-family:system-ui,sans-serif;background:#0b1026;color:#fff}
canvas{display:block}
#hud{position:fixed;top:12px;left:12px;font-weight:700;font-size:18px;text-shadow:0 2px 4px #000;pointer-events:none}
#lb{position:fixed;top:12px;right:12px;background:#0008;padding:10px 14px;border-radius:12px;font-size:14px;min-width:160px}
#lb b{display:block;margin-bottom:4px;color:#ffd447}
#help{position:fixed;bottom:12px;left:12px;font-size:13px;opacity:.8}
#auth{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#0b1026cc;z-index:5}
.card{background:#1b2350;padding:28px;border-radius:18px;width:320px;display:flex;flex-direction:column;gap:10px;box-shadow:0 10px 40px #000a}
.card h1{margin:0;text-align:center;color:#ffd447}
input,button{padding:11px;border-radius:10px;border:0;font-size:15px}
button{background:#ffd447;font-weight:700;cursor:pointer}button.alt{background:#3b4a9c;color:#fff}
#msg{color:#ff8a8a;font-size:13px;min-height:16px;text-align:center}
</style></head><body>
<div id="auth"><div class="card"><h1>🪙 Coin Rush 3D</h1>
<input id="name" placeholder="Your name" maxlength="12">
<button id="play">Play</button><div id="msg">Your coins save automatically in this browser.</div></div></div>
<div id="hud">🪙 <span id="score">0</span> &nbsp; 👥 <span id="online">1</span></div>
<div id="lb"><b>🏆 Leaderboard</b><div id="lbl">–</div></div>
<div id="help">WASD move · Space jump · Shift dash · drag to look · cyan pads launch you · climb the tower for the 10-coin jackpot</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
const $ = id => document.getElementById(id);

// ---------- three.js scene ----------
const R = 40, rnd = (a, b) => a + Math.random() * (b - a);
const scene = new THREE.Scene();
scene.fog = new THREE.Fog(0x8a5f9c, 70, 190);
const cam = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, .1, 400);
const ren = new THREE.WebGLRenderer({ antialias: true });
ren.setSize(innerWidth, innerHeight); ren.setPixelRatio(Math.min(devicePixelRatio, 2)); ren.shadowMap.enabled = true; document.body.appendChild(ren.domElement);
const M = (c, o = {}) => new THREE.MeshStandardMaterial(Object.assign({ color: c, flatShading: true }, o));
// sky + stars
scene.add(new THREE.Mesh(new THREE.SphereGeometry(300, 24, 16), new THREE.ShaderMaterial({ side: THREE.BackSide, depthWrite: false,
  vertexShader: 'varying vec3 p;void main(){p=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}',
  fragmentShader: 'varying vec3 p;void main(){float h=clamp(normalize(p).y*1.5+.1,0.,1.);vec3 c=mix(vec3(1.,.6,.42),vec3(.08,.07,.3),pow(h,.55));gl_FragColor=vec4(c,1.);}' })));
const sv = []; for (let i = 0; i < 500; i++) { const a = rnd(0, 6.28), e = rnd(.1, 1.5), r = 280; sv.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r); }
const sg = new THREE.BufferGeometry(); sg.setAttribute('position', new THREE.Float32BufferAttribute(sv, 3));
scene.add(new THREE.Points(sg, new THREE.PointsMaterial({ color: 0xffffff, size: 2, sizeAttenuation: false, fog: false })));
const sunMesh = new THREE.Mesh(new THREE.SphereGeometry(18, 16, 12), new THREE.MeshBasicMaterial({ color: 0xffd9a0, fog: false })); sunMesh.position.set(-150, 60, -200); scene.add(sunMesh);
scene.add(new THREE.HemisphereLight(0xffd2b0, 0x4a3a7a, .85));
const sun = new THREE.DirectionalLight(0xffc890, 1); sun.position.set(-30, 40, -40); sun.castShadow = true;
Object.assign(sun.shadow.camera, { left: -50, right: 50, top: 50, bottom: -50 }); sun.shadow.mapSize.set(2048, 2048); scene.add(sun);
// island
const isl = new THREE.Mesh(new THREE.CylinderGeometry(R, R, 1, 48), M(0x4cc38a)); isl.position.y = -.5; isl.receiveShadow = true; scene.add(isl);
const under = new THREE.Mesh(new THREE.ConeGeometry(R, 26, 24), M(0x6b4f7a)); under.rotation.x = Math.PI; under.position.y = -14; scene.add(under);
const plaza = new THREE.Mesh(new THREE.CylinderGeometry(9, 9, .1, 32), M(0xf3d9a4)); plaza.position.y = .03; plaza.receiveShadow = true; scene.add(plaza);
const rim = new THREE.Mesh(new THREE.TorusGeometry(R, .5, 8, 64), M(0xff5fa2, { emissive: 0xaa2060 })); rim.rotation.x = Math.PI / 2; scene.add(rim);
const water = new THREE.Mesh(new THREE.CircleGeometry(250, 32), new THREE.MeshStandardMaterial({ color: 0x2a6fd6, transparent: true, opacity: .75, emissive: 0x0a2a66 }));
water.rotation.x = -Math.PI / 2; water.position.y = -30; scene.add(water);
// platforms: [x,z,w,d,h]
const plats = [[22,8,8,8,2],[-22,10,8,8,3.5],[0,-26,9,9,5],[30,-16,7,7,2.5],[-30,-18,7,7,6.5],[-8,28,6,6,8],[14,26,6,6,12]];
const slots = [], slotVal = [];
for (let i = 0; i < 12; i++) { const a = i / 12 * 6.28; slots.push([Math.cos(a) * 30, 1, Math.sin(a) * 30]); slotVal.push(1); }
plats.forEach(([x, z, w, d, h]) => { slots.push([x, h + 1, z]); slotVal.push(2); });
// spiral tower to the jackpot
for (let i = 0; i < 10; i++) { const a = i * .55 + .3, h = 1.7 * (i + 1); plats.push([Math.cos(a) * 14, Math.sin(a) * 14, 5, 5, h]); }
plats.push([0, 0, 8, 8, 18.7]); slots.push([0, 19.7, 0]); slotVal.push(10);
plats.forEach(([x, z, w, d, h], i) => { const m = new THREE.Mesh(new THREE.BoxGeometry(w, h, d), M(new THREE.Color().setHSL((i * .09) % 1, .7, .62)));
  m.position.set(x, h / 2, z); m.castShadow = m.receiveShadow = true; scene.add(m);
  const t = new THREE.Mesh(new THREE.BoxGeometry(w + .3, .25, d + .3), M(0xffffff, { emissive: 0x333333 })); t.position.set(x, h + .1, z); scene.add(t); });
// bounce pads
const pads = [[-33, -4], [32, 20], [-6, -34], [6, 14]];
pads.forEach(([x, z]) => { const p = new THREE.Mesh(new THREE.CylinderGeometry(1.8, 2, .3, 20), M(0x40e0ff, { emissive: 0x1090b0 })); p.position.set(x, .15, z); scene.add(p);
  const r = new THREE.Mesh(new THREE.TorusGeometry(1.6, .12, 8, 24), M(0xffffff, { emissive: 0xffffff })); r.rotation.x = Math.PI / 2; r.position.set(x, .35, z); scene.add(r); });
// trees
for (let i = 0; i < 34; i++) { const a = rnd(0, 6.28), r = rnd(19, 37), x = Math.cos(a) * r, z = Math.sin(a) * r;
  if (plats.slice(0, 7).some(([px, pz, w, d]) => Math.abs(x - px) < w / 2 + 2 && Math.abs(z - pz) < d / 2 + 2)) continue;
  const g = new THREE.Group(), s = rnd(.8, 1.6), col = [0x2fa86a, 0xff8fb8, 0xffb347][i % 3];
  const tr = new THREE.Mesh(new THREE.CylinderGeometry(.25 * s, .35 * s, 2 * s, 6), M(0x8a5a3a)); tr.position.y = s; tr.castShadow = true; g.add(tr);
  for (let k = 0; k < 3; k++) { const c = new THREE.Mesh(new THREE.ConeGeometry((1.7 - k * .4) * s, 1.8 * s, 7), M(col)); c.position.y = (2.4 + k * 1.1) * s; c.castShadow = true; g.add(c); }
  g.position.set(x, 0, z); scene.add(g); }
// crystals + clouds
const crystals = []; for (let i = 0; i < 10; i++) { const a = i / 10 * 6.28, c = new THREE.Mesh(new THREE.OctahedronGeometry(1.4), M(i % 2 ? 0xff5fd2 : 0x5ff0ff, { emissive: i % 2 ? 0x992288 : 0x1190a0 }));
  c.scale.y = 1.8; c.position.set(Math.cos(a) * 38, 2.6, Math.sin(a) * 38); scene.add(c); crystals.push(c); }
const clouds = new THREE.Group(); for (let i = 0; i < 12; i++) { const g = new THREE.Group(); for (let k = 0; k < 4; k++) { const b = new THREE.Mesh(new THREE.SphereGeometry(rnd(3, 6), 8, 6), new THREE.MeshBasicMaterial({ color: 0xffe3d6, transparent: true, opacity: .85 })); b.position.set(k * 4 - 6, rnd(-1, 1), rnd(-2, 2)); g.add(b); }
  const a = rnd(0, 6.28), r = rnd(60, 120); g.position.set(Math.cos(a) * r, rnd(25, 55), Math.sin(a) * r); clouds.add(g); } scene.add(clouds);
const coinMeshes = slots.map((p, i) => { const m = new THREE.Mesh(new THREE.CylinderGeometry(.7, .7, .15, 20), M(0xffd447, { emissive: 0xaa7a00, metalness: .6, roughness: .3, flatShading: false }));
  m.rotation.x = Math.PI / 2; m.position.set(...p); m.castShadow = true; if (slotVal[i] > 5) m.scale.set(2.2, 1, 2.2); scene.add(m); return m; });
const coinTime = slots.map(() => 0);
const COIN_RESPAWN = 8000;
// particles
const parts = [], pGeo = new THREE.SphereGeometry(.15, 6, 6);
function burst(x, y, z, col, n) { for (let i = 0; i < n; i++) { const m = new THREE.Mesh(pGeo, new THREE.MeshBasicMaterial({ color: col, transparent: true })); m.position.set(x, y + 1, z); scene.add(m); parts.push({ m, v: new THREE.Vector3(rnd(-4, 4), rnd(2, 9), rnd(-4, 4)), l: 1 }); } }

function label(text){const c=document.createElement('canvas');c.width=256;c.height=64;const g=c.getContext('2d');
  g.font='bold 34px system-ui';g.textAlign='center';g.fillStyle='#000a';g.fillRect(0,8,256,48);g.fillStyle='#fff';g.fillText(text,128,45);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),depthTest:false}));s.scale.set(3,.75,1);s.position.y=2.8;return s;}
function makeAvatar(name,color){const g=new THREE.Group();
  const b=new THREE.Mesh(new THREE.CylinderGeometry(.6,.6,1.4,16),new THREE.MeshStandardMaterial({color}));
  b.position.y=.9;b.castShadow=true;g.add(b);
  const h=new THREE.Mesh(new THREE.SphereGeometry(.55,16,12),new THREE.MeshStandardMaterial({color:0xffe0bd}));h.position.y=2;h.castShadow=true;g.add(h);
  const e=new THREE.Mesh(new THREE.BoxGeometry(.5,.15,.1),new THREE.MeshBasicMaterial({color:0x111111}));e.position.set(0,2.05,.5);g.add(e);
  g.add(label(name));scene.add(g);return g;}

// ---------- game state ----------
const store = { get(k,d){try{const v=localStorage.getItem('coinrush_'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}}, set(k,v){try{localStorage.setItem('coinrush_'+k,JSON.stringify(v));}catch(e){}} };
let meMesh, myName = store.get('name',''), myColor = store.get('color', 0x404040 + Math.floor(Math.random()*0xbfbfbf)), score = store.get('score',0), room = null;
const myTaken = {};
const P = { x:0, y:0, z:0, vy:0, ry:0 };
let yaw = 0, pitch = .45, started = false;
const keys = {};
addEventListener('keydown', e => { keys[e.code] = true; if (e.code === 'Space') e.preventDefault(); });
addEventListener('keyup', e => keys[e.code] = false);
let drag = false; ren.domElement.addEventListener('pointerdown', () => drag = true);
addEventListener('pointerup', () => drag = false);
addEventListener('pointermove', e => { if (drag) { yaw -= e.movementX * .005; pitch = Math.max(.1, Math.min(1.2, pitch + e.movementY * .004)); } });
addEventListener('resize', () => { cam.aspect = innerWidth / innerHeight; cam.updateProjectionMatrix(); ren.setSize(innerWidth, innerHeight); });

function groundAt(x, z, feet) {
  let g = 0;
  for (const [px,pz,w,d,h] of plats) if (Math.abs(x-px)<w/2 && Math.abs(z-pz)<d/2 && feet >= h-.6) g = Math.max(g, h);
  return g;
}

// ---------- multiplayer (live room, no login) ----------
const others = {};
function syncPeers(ch) {
  const seen = {};
  const lb = [{ n: myName, s: score, me: true }];
  for (const p of ch.peers) {
    const v = p.presence || {};
    if (v.taken) for (const k in v.taken) coinTime[k] = Math.max(coinTime[k] || 0, v.taken[k]);
    if (p.isMe) continue;
    if (typeof v.x !== 'number') continue;
    seen[p.peer] = 1; lb.push({ n: String(v.n || '?').slice(0, 12), s: v.s | 0 });
    let o = others[p.peer];
    if (!o) { o = others[p.peer] = { m: makeAvatar(String(v.n || '?').slice(0, 12), v.c | 0), t: v }; o.m.position.set(v.x, v.y, v.z); }
    o.t = v;
  }
  for (const id in others) if (!seen[id]) { scene.remove(others[id].m); delete others[id]; }
  lb.sort((a, b) => b.s - a.s);
  $('lbl').innerHTML = lb.slice(0, 5).map((u, i) => `${i + 1}. ${u.me ? '⭐ ' : ''}${u.n} — ${u.s}`).join('<br>');
  $('online').textContent = lb.length;
}
async function connect() {
  try {
    room = await claude.use('room'); if (!room) return;
    room.onPeers(syncPeers);
    setInterval(() => room.presence({ x: P.x, y: P.y, z: P.z, ry: P.ry, n: myName, c: myColor, s: score, taken: myTaken }).catch(() => {}), 100);
  } catch (e) { room = null; }
}
function collect(i) {
  coinTime[i] = Date.now(); myTaken[i] = coinTime[i];
  score += slotVal[i]; burst(slots[i][0], slots[i][1] - 1, slots[i][2], 0xffd447, slotVal[i] > 5 ? 40 : 14); store.set('score', score); $('score').textContent = score;
}

// ---------- start ----------
$('name').value = myName;
$('play').onclick = () => {
  myName = ($('name').value.trim() || 'Player' + (Math.random() * 99 | 0)).slice(0, 12);
  store.set('name', myName); store.set('color', myColor);
  $('auth').style.display = 'none'; $('score').textContent = score;
  meMesh = makeAvatar(myName, myColor); started = true;
  $('lbl').textContent = '⭐ ' + myName + ' — ' + score;
  if (window.claude && claude.use) connect();
};

// ---------- loop ----------
const clock = new THREE.Clock();
(function loop() {
  requestAnimationFrame(loop);
  const dt = Math.min(clock.getDelta(), .05), t = performance.now() / 1000;
  coinMeshes.forEach((m, i) => { const on = Date.now() - coinTime[i] > COIN_RESPAWN; m.visible = on; m.rotation.z = t * 2; m.position.y = slots[i][1] + Math.sin(t * 3 + i) * .2; });
  crystals.forEach((c, i) => { c.rotation.y = t + i; c.position.y = 2.6 + Math.sin(t * 2 + i) * .4; }); clouds.rotation.y = t * .01;
  for (let i = parts.length - 1; i >= 0; i--) { const p = parts[i]; p.l -= dt * 1.4; p.v.y -= 20 * dt; p.m.position.addScaledVector(p.v, dt); p.m.material.opacity = Math.max(p.l, 0); if (p.l <= 0) { scene.remove(p.m); p.m.material.dispose(); parts.splice(i, 1); } }
  if (started) {
    let f = (keys.KeyW||keys.ArrowUp?1:0) - (keys.KeyS||keys.ArrowDown?1:0), s = (keys.KeyD||keys.ArrowRight?1:0) - (keys.KeyA||keys.ArrowLeft?1:0);
    const sp = (keys.ShiftLeft || keys.ShiftRight ? 17 : 10) * dt;
    if (f || s) {
      const dx = -Math.sin(yaw) * f + Math.cos(yaw) * s, dz = -Math.cos(yaw) * f - Math.sin(yaw) * s, l = Math.hypot(dx, dz);
      P.x += dx / l * sp; P.z += dz / l * sp; P.ry = Math.atan2(dx, dz);
    }
    const g = groundAt(P.x, P.z, P.y);
    if (P.y <= g + .01 && P.vy <= 0) { P.y = g; P.vy = 0; if (keys.Space) P.vy = 14; }
    if (P.y <= g + .1) for (const q of pads) if (Math.hypot(P.x - q[0], P.z - q[1]) < 1.9) { P.vy = 28; burst(P.x, P.y, P.z, 0x66ffff, 14); }
    P.vy -= 34 * dt; P.y += P.vy * dt;
    if (P.y < g && P.vy < 0) { P.y = g; P.vy = 0; }
    if (Math.hypot(P.x, P.z) > R || P.y < -25) { P.x = P.z = 0; P.y = 3; P.vy = 0; }
    meMesh.position.set(P.x, P.y, P.z); meMesh.rotation.y = P.ry;
    slots.forEach((p, i) => { if (Date.now() - coinTime[i] > COIN_RESPAWN && Math.hypot(P.x-p[0], P.y+1-p[1], P.z-p[2]) < 1.8) collect(i); });
    cam.position.set(P.x + Math.sin(yaw) * Math.cos(pitch) * 12, P.y + 2 + Math.sin(pitch) * 12, P.z + Math.cos(yaw) * Math.cos(pitch) * 12);
    cam.lookAt(P.x, P.y + 1.5, P.z);
  } else { cam.position.set(Math.sin(t * .2) * 45, 25, Math.cos(t * .2) * 45); cam.lookAt(0, 8, 0); }
  for (const id in others) { const o = others[id]; o.m.position.lerp(new THREE.Vector3(o.t.x, o.t.y, o.t.z), .2); o.m.rotation.y = o.t.ry; }
  ren.render(scene, cam);
})();
</script></body></html>
